sonar.projectKey=markmercado1_BiblioTech-Evaluation-U1-U2
sonar.organization=markmercado1
sonar.projectName=BiblioTech-Evaluation-U1-U2

# Código fuente del backend (Java) y del frontend (Angular)
sonar.sources=backend/src/main/java,frontend/src
sonar.exclusions=**/*.spec.ts
sonar.tests=backend/src/test/java,frontend/src
sonar.test.inclusions=**/*Test.java,**/*.spec.ts

# Clases compiladas del backend (las genera el paso "mvn verify" del workflow)
sonar.java.binaries=backend/target/classes

# Cobertura del backend: reporte XML de JaCoCo generado por "mvn verify"
sonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml
sonar.coverage.exclusions=**/BibliotechV2Application.java
