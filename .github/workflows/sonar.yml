name: SonarQube Cloud

on:
  push:
    branches: [develop]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  analisis:
    name: Análisis de calidad con SonarQube Cloud
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: bibliotech_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bibliotech_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/bibliotech_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres_test
      SPRING_PROFILES_ACTIVE: ci

    steps:
      - name: Obtener código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Ejecutar pruebas y generar el reporte de cobertura JaCoCo
        working-directory: backend
        run: mvn -B verify

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias del frontend
        working-directory: frontend
        run: npm ci

      - name: Ejecutar pruebas de Angular y generar su cobertura
        working-directory: frontend
        run: npx ng test --watch=false

      - name: Ajustar las rutas del reporte lcov a la raíz del repositorio
        run: sed -i 's|^SF:|SF:frontend/|' frontend/coverage/bibliotech-v2fe/lcov.info

      - name: Analizar con SonarQube Cloud
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
