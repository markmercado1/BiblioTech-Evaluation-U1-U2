name: BiblioTech CI

# Se ejecuta en cada push y en cada pull request hacia las ramas protegidas.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

# Si llega un push nuevo a la misma rama, se cancela la ejecución anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend - Maven, JUnit y JaCoCo
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: bibliotech_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bibliotech_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/bibliotech_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
      SPRING_PROFILES_ACTIVE: ci

    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Configurar Java 21 (con caché de Maven)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Compilar, probar y verificar la cobertura (mvn verify)
        working-directory: backend
        run: mvn -B verify

      - name: Publicar el reporte de cobertura JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-jacoco
          path: backend/target/site/jacoco/
          if-no-files-found: ignore

  frontend:
    name: Frontend - ESLint, pruebas y build
    runs-on: ubuntu-latest

    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Configurar Node.js (con caché de npm)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci

      - name: Ejecutar ESLint
        working-directory: frontend
        run: npx ng lint

      - name: Ejecutar las pruebas de Angular con cobertura
        working-directory: frontend
        run: npx ng test --watch=false

      - name: Compilar Angular
        working-directory: frontend
        run: npx ng build

      - name: Publicar el reporte de cobertura de Angular
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-cobertura-angular
          path: frontend/coverage/
          if-no-files-found: ignore

  contenedores:
    name: Contenedores - Docker Compose
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Preparar las variables de entorno
        env:
          CI_DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
        run: |
          grep -v '^POSTGRES_PASSWORD=' .env.example > .env
          echo "POSTGRES_PASSWORD=$CI_DB_PASSWORD" >> .env

      - name: Construir y levantar backend, frontend y base de datos
        run: docker compose up -d --build

      - name: Comprobar que el sistema responde
        run: |
          for intento in $(seq 1 30); do
            if curl -fsS http://localhost:8080/api/libros > /dev/null; then
              echo "Backend disponible"; break
            fi
            sleep 5
          done
          curl -fsS http://localhost:8080/api/libros
          curl -fsS http://localhost:4200 > /dev/null
          docker compose ps

      - name: Comprobar que el frontend puede escribir en el backend desde otra dirección pública
        run: |
          # Simula el navegador con el frontend desplegado en una dirección HTTPS distinta de localhost.
          # Sin el ajuste de nginx que quita la cabecera Origin, el backend respondería 403.
          CODIGO="$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:4200/api/estudiantes \
            -H 'Content-Type: application/json' \
            -H 'Origin: https://bibliotech-frontend.onrender.com' \
            -d "{\"dni\":\"ci-$(date +%s)\",\"nombre\":\"Prueba CI\"}")"
          echo "POST /api/estudiantes con Origin externo respondió $CODIGO"
          test "$CODIGO" = "201"

      - name: Mostrar los registros si algo falló
        if: failure()
        run: docker compose logs --no-color

      - name: Detener los contenedores
        if: always()
        run: docker compose down -v
