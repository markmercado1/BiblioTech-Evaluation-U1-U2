spring.application.name=bibliotech_v2

# Perfil por defecto: dev. En producción se activa con SPRING_PROFILES_ACTIVE=prod.
spring.profiles.default=dev

# Puerto: lo asigna la plataforma de despliegue con PORT; en local es 8080.
server.port=${PORT:8080}

# Conexión a la base de datos. La contraseña NO tiene valor por defecto:
# debe venir de la variable de entorno SPRING_DATASOURCE_PASSWORD
# (archivo .env en local, GitHub Secrets o el panel del hosting en el despliegue).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bibliotech_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.open-in-view=false
